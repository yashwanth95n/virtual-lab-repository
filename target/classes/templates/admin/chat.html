<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Chat</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<style>
.chat-wrap{display:flex;gap:20px;height:calc(100vh - 140px)}
.chat-list{width:280px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);overflow:auto}
.chat-list-item{padding:14px 16px;border-bottom:1px solid #f1f5f9;cursor:default}
.chat-list-item .name{font-weight:600}
.chat-list-item .meta{font-size:.75rem;color:#64748b}
.chat-panel{flex:1;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow:auto;padding:20px;background:#f8fafc}
.bubble{max-width:70%;padding:12px 16px;border-radius:16px;margin-bottom:12px;font-size:.95rem}
.bubble.student{background:#fff;border:1px solid #e2e8f0;border-bottom-left-radius:4px}
.bubble.admin{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bubble .who{font-size:.75rem;opacity:.8;margin-bottom:4px}
.chat-input{padding:16px;border-top:1px solid #e2e8f0;display:flex;gap:10px}
.chat-input input{flex:1;padding:12px 16px;border:1px solid #e2e8f0;border-radius:999px}
</style>
</head>
<body>
<div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
<div class="main">
  <div th:replace="~{fragments/layout :: topbar('Messages', ${admin})}"></div>
  <div class="content">
    <div class="chat-wrap">
      <div class="chat-list">
        <div style="padding:16px;font-weight:700;border-bottom:1px solid #f1f5f9">Conversations</div>
        <div th:each="m : ${messages}" class="chat-list-item" th:if="${m.fromRole == 'STUDENT'}">
          <div class="name" th:text="${m.fromName}">Student</div>
          <div class="meta">
            Roll: <span th:text="${rollMap != null && rollMap.containsKey(m.fromUserId) ? rollMap.get(m.fromUserId) : '—'}">—</span>
            · <span th:text="${m.sentAt != null ? #temporals.format(m.sentAt,'MMM d HH:mm') : ''}">—</span>
          </div>
          <div style="font-size:.85rem;margin-top:4px;color:#475569" th:text="${#strings.abbreviate(m.message,60)}">msg</div>
        </div>
        <div th:if="${#lists.isEmpty(messages)}" style="padding:16px;color:#94a3b8">No messages yet</div>
      </div>
      <div class="chat-panel">
        <div class="chat-msgs">
          <div th:each="m : ${messages}" class="bubble" th:classappend="${m.fromRole == 'ADMIN'} ? 'admin' : 'student'">
            <div class="who">
              <span th:text="${m.fromName}">Name</span>
              <span th:if="${m.fromRole == 'STUDENT'}"> · Roll <span th:text="${rollMap != null && rollMap.containsKey(m.fromUserId) ? rollMap.get(m.fromUserId) : '—'}">—</span></span>
            </div>
            <div th:text="${m.message}">Message</div>
          </div>
        </div>
        <div style="padding:12px 16px;border-top:1px solid #e2e8f0">
          <p class="text-sm text-muted">Reply to a student using the form on their latest message below.</p>
          <div th:each="m : ${messages}" th:if="${m.fromRole == 'STUDENT'}" style="margin-top:8px">
            <form th:action="@{/admin/chat/reply}" method="post" class="chat-input" style="border:none;padding:4px 0">
              <input type="hidden" name="toUserId" th:value="${m.fromUserId}"/>
              <input type="text" name="message" th:placeholder="'Reply to ' + ${m.fromName} + '...'" required/>
              <button type="submit" class="btn btn-primary">Send</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
