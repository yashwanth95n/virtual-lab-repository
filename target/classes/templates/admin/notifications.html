<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Notifications · Ledger LMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Notifications', ${admin})}"></div>
    <div class="content">
      <div class="form-card">
        <h3 class="mb-2">Send a notification</h3>
        <form method="post" th:action="@{/admin/notifications/send}">
          <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" placeholder="e.g. Platform maintenance notice" required/>
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea name="message" placeholder="Write the notification content..." required></textarea>
          </div>
          <div class="form-group">
            <label>Audience</label>
            <select name="audience">
              <option value="All users">All users</option>
              <option value="Students">Students</option>
              <option value="Instructors">Instructors</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-full">Send notification</button>
        </form>
      </div>
      <div class="table-card mt-3" th:if="${!#lists.isEmpty(notifications)}">
        <h3>Sent notifications</h3>
        <table class="table table-hover table-bordered">
          <thead class="table-light"><tr><th>Title</th><th>Audience</th><th>Sent</th></tr></thead>
          <tbody>
            <tr th:each="n : ${notifications}">
              <td th:text="${n.title}">Title</td>
              <td th:text="${n.audience}">All</td>
              <td th:text="${n.sentAt != null ? #temporals.format(n.sentAt, 'MMM d HH:mm') : '-'}">—</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
