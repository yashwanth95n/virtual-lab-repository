<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Course codes · Ledger LMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Course', ${admin})}"></div>
    <div class="content">
      <div class="form-card mb-2" style="border:none;box-shadow:none;padding:0 0 16px;background:transparent">
        <h3 class="mb-2">Add new branch</h3>
        <form method="post" th:action="@{/admin/branches/add}" class="flex gap-3" style="align-items:flex-end;">
          <div class="form-group" style="margin:0;"><label>Code</label><input type="text" name="code" required placeholder="Course Code"/></div>
          <div class="form-group" style="margin:0;flex:1;"><label>Name</label><input type="text" name="name" required placeholder="Course Name"/></div>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <p class="hint mt-2">Deleted branches are removed from student registration immediately.</p>
      </div>
      <div class="table-card">
        <table class="table table-hover table-bordered">
          <thead class="table-light"><tr><th>Code</th><th>Name</th><th>Action</th></tr></thead>
          <tbody>
            <tr th:each="b : ${branches}">
              <td th:text="${b.code}">CS</td>
              <td th:text="${b.name}">Computer Science</td>
              <td>
                <form th:action="@{/admin/branches/{id}/delete(id=${b.id})}" method="post"
                      onsubmit="return confirm('Delete branch ' + /*[[${b.code}]]*/ 'X' + '? It will disappear from student signup.');">
                  <button type="submit" class="btn btn-outline btn-sm" style="color:#ef4444">Delete</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(branches)}"><td colspan="3" class="text-muted">No branches.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
