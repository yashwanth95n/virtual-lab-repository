<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Lab VM</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: student-sidebar(${activePage})}"></div>
<div class="main">
  <div th:replace="~{fragments/layout :: topbar('Lab VM', ${student})}"></div>
  <div class="content">
    <p th:if="${param.error}" style="color:#b91c1c">Could not start Docker lab. Is Docker Desktop running?</p>
    <p class="text-muted mb-3">Ubuntu and Kali labs open as a full desktop<strong>inside this website</strong> (noVNC).</p>
    <div class="course-grid" style="grid-template-columns:repeat(3,1fr)">
      <div th:each="v : ${vms}" class="course-card">
        <div class="card-art art-green"><span>🖥️</span></div>
        <div class="card-body">
          <h3 th:text="${v.name}">Lab</h3>
          <div class="card-meta" th:text="${v.osType != null ? v.osType : 'Ubuntu'}">Ubuntu</div>
          <div class="card-footer" style="flex-wrap:wrap;gap:6px">
            <span class="badge badge-published" th:text="${v.status}">Assigned</span>
            <a th:if="${v.novncUrl != null}" th:href="@{/student/lab/{id}/desktop(id=${v.id})}"
               class="btn btn-primary btn-sm">Open desktop</a>
            <form th:if="${v.novncUrl == null}" th:action="@{/student/lab/{id}/launch(id=${v.id})}" method="post" style="display:inline">
              <button type="submit" class="btn btn-primary btn-sm">Launch lab</button>
            </form>
            <form th:if="${v.containerId != null}" th:action="@{/student/lab/{id}/stop(id=${v.id})}" method="post" style="display:inline">
              <button type="submit" class="btn btn-outline btn-sm">Stop</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(vms)}" class="text-muted">No lab assigned. Ask Admin to create labs (leave branch empty to assign all students).</p>
  </div>
</div>
</body>
</html>
