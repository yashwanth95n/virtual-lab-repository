<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${vm.name}">Kali Terminal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css"/>
  <style>
    .term-wrap{background:#0b1220;border-radius:12px;padding:12px;min-height:420px}
    #terminal{height:60vh;width:100%}
    .lab-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  </style>
</head>
<body>
<div th:replace="~{fragments/layout :: student-sidebar(${activePage})}"></div>
<div class="main">
  <div th:replace="~{fragments/layout :: topbar(${vm.name}, ${student})}"></div>
  <div class="content">
    <div class="lab-bar">
      <div>
        <strong th:text="${vm.name}">Lab</strong>
        <span class="text-sm text-muted" th:text="' · ' + ${vm.sshHost} + ':' + ${vm.sshPort}">host</span>
      </div>
      <a th:href="@{/student/lab}" class="btn btn-outline btn-sm">← Back</a>
    </div>
    <div class="term-wrap">
      <div id="terminal"></div>
    </div>
    <div class="form-card mt-3" style="max-width:640px">
      <h3>Submit lab work</h3>
      <p class="hint">Upload notes, screenshots, or scripts from your practice.</p>
      <form method="post" th:action="@{/student/lab/{id}/save(id=${vm.id})}" enctype="multipart/form-data">
        <div class="form-group"><input type="file" name="workFile" required/></div>
        <button type="submit" class="btn btn-primary">Submit to admin</button>
      </form>
      <p th:if="${param.saved}" class="hint" style="color:#059669">Submitted successfully.</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script th:inline="javascript">
  /*<![CDATA[*/
  const vmId = /*[[${vm.id}]]*/ 0;
  const term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    theme: { background: '#0b1220', foreground: '#e2e8f0' }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('terminal'));
  fit.fit();
  window.addEventListener('resize', () => fit.fit());

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto + '://' + location.host + '/ws/terminal/' + vmId);
  ws.onopen = () => term.writeln('\x1b[33mConnecting to Kali via SSH…\x1b[0m');
  ws.onmessage = (e) => term.write(e.data);
  ws.onclose = () => term.writeln('\r\n\x1b[31mDisconnected\x1b[0m');
  ws.onerror = () => term.writeln('\r\n\x1b[31mWebSocket error\x1b[0m');
  term.onData(data => { if (ws.readyState === 1) ws.send(data); });
  /*]]>*/
</script>
</body>
</html>
