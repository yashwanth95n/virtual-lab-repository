<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Labs</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: student-sidebar(${activePage})}"></div>
<div class="main">
  <div th:replace="~{fragments/layout :: topbar('Labs', ${student})}"></div>
  <div class="content">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h3 class="mb-0">Course labs</h3>
      <a th:href="@{/student/lab}" class="btn btn-primary btn-sm" target="_blank" rel="noopener">Lab VM</a>
    </div>

    <div class="table-card">
      <table class="table table-hover table-bordered">
        <thead class="table-light"><tr><th>Lab</th><th>Branch</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
          <tr th:each="l : ${labs}">
            <td th:text="${l.title}">Lab</td>
            <td th:text="${l.branch}">CS</td>
            <td><span class="badge badge-published" th:text="${l.status}">Published</span></td>
            <td><a th:href="@{/student/labs/{id}(id=${l.id})}" class="btn btn-outline btn-sm">Open</a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(labs)}"><td colspan="4" class="text-muted">No labs published for your branch.</td></tr>
        </tbody>
      </table>
    </div>

    <div class="form-card mt-3">
      <h3 class="mb-2">Lab VM</h3>
      <p class="text-muted small mb-3">VMs assigned to you by admin. Open to use the terminal.</p>
      <div class="course-grid" style="grid-template-columns:repeat(3,1fr)" th:if="${labVms != null and !#lists.isEmpty(labVms)}">
        <div th:each="v : ${labVms}" class="course-card">
          <div class="card-art art-green"><span>🐉</span></div>
          <div class="card-body">
            <h4 th:text="${v.name}">Kali Lab</h4>
            <p class="text-muted small" th:text="${v.osType != null ? v.osType : 'VM'} + ${v.sshHost != null ? ' · ' + v.sshHost : ''}">Kali</p>
            <div class="card-footer">
              <span class="badge badge-published" th:text="${v.status}">Assigned</span>
              <a th:if="${v.novncUrl != null}" th:href="${v.novncUrl}" class="btn btn-primary btn-sm" target="_blank" rel="noopener">Open Lab</a>
              <form th:if="${v.novncUrl == null}" th:action="@{/student/lab/{id}/launch(id=${v.id})}" method="post" target="_blank" style="display:inline">
                <button type="submit" class="btn btn-primary btn-sm">Launch Lab</button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <p th:if="${labVms == null or #lists.isEmpty(labVms)}" class="text-muted">No Lab VM assigned yet. Admin must assign one from Lab management.</p>
    </div>
  </div>
</div>
</body>
</html>
