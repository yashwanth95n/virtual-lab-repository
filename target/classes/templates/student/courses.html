<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Courses</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: student-sidebar(${activePage})}"></div>
<div class="main">
  <div th:replace="~{fragments/layout :: topbar('Courses', ${student})}"></div>
  <div class="content">
    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
      <h3 class="mb-0 me-2">Courses</h3>
      <span class="text-muted small me-1">Filter:</span>
      <a th:href="@{/student/courses(filter='all')}" class="btn btn-sm"
         th:classappend="${filter == null or filter == 'all'} ? 'btn-primary' : 'btn-outline'">All</a>
      <a th:href="@{/student/courses(filter='enrolled')}" class="btn btn-sm"
         th:classappend="${filter == 'enrolled'} ? 'btn-primary' : 'btn-outline'">Enrolled</a>
    </div>
    <div class="course-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="course-card card-3d" th:each="c,stat : ${courses}">
        <div class="card-art" th:if="${c.coverImage == null}"
             th:classappend="${stat.index % 6 == 0} ? 'art-pink' : (${stat.index % 6 == 1} ? 'art-purple' : (${stat.index % 6 == 2} ? 'art-blue' : (${stat.index % 6 == 3} ? 'art-green' : (${stat.index % 6 == 4} ? 'art-yellow' : 'art-orange'))))">
          <span>📚</span>
        </div>
        <div class="card-art" th:if="${c.coverImage != null}" style="padding:0;overflow:hidden">
          <img th:src="${c.coverImage}" alt="" style="width:100%;height:140px;object-fit:cover"/>
        </div>
        <div class="card-body">
          <h4 th:text="${c.title}">Title</h4>
          <p th:text="${c.instructorName}">Instructor</p>
          <div class="card-footer">
            <span class="badge badge-published" th:text="${c.status}">Published</span>
            <a th:if="${enrolledIds != null and enrolledIds.contains(c.id)}"
               th:href="@{/student/course/{id}(id=${c.id})}" class="btn btn-outline btn-sm">Open</a>
            <form th:unless="${enrolledIds != null and enrolledIds.contains(c.id)}"
                  th:action="@{/student/courses/{id}/enroll(id=${c.id})}" method="post" style="display:inline">
              <button type="submit" class="btn btn-primary btn-sm">Enroll</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(courses)}" class="text-muted mt-3">No courses to show for this filter.</p>
  </div>
</div>
</body>
</html>
