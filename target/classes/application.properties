spring.application.name=Ledger LMS
server.port=8085
server.address=0.0.0.0

# ---- Database: MySQL only ----
spring.datasource.url=jdbc:mysql://localhost:3306/ledgerlms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- File uploads ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=2147483647
file.upload-dir=uploads
spring.thymeleaf.cache=false

# ---- Session ----
server.servlet.session.timeout=8h
server.servlet.session.cookie.max-age=28800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ---- Docker Lab ----
lab.docker.enabled=true
lab.docker.image=lscr.io/linuxserver/webtop:ubuntu-xfce

# Firebase Web config is loaded from classpath: firebase-web-config.json (not here)
# Optional Admin SDK JSON: firebase-service-account.json

