spring.application.name=Ledger LMS
server.port=8085

# ---- Database: MySQL only ----
# Create DB: CREATE DATABASE ledgerlms CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Or run: mysql -u root -p < schema-mysql.sql
spring.datasource.url=jdbc:mysql://localhost:3306/ledgerlms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- File uploads ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=2147483647
file.upload-dir=uploads

spring.thymeleaf.cache=false

# ---- Session ----
server.servlet.session.timeout=8h
server.servlet.session.cookie.max-age=28800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ---- Docker Lab (Ubuntu/Kali GUI via noVNC) ----
lab.docker.enabled=true
lab.docker.image=lscr.io/linuxserver/webtop:ubuntu-xfce

# ---- Firebase (Google Sign-In only) ----
firebase.api-key=YOUR_FIREBASE_API_KEY
firebase.auth-domain=YOUR_PROJECT.firebaseapp.com
firebase.project-id=YOUR_PROJECT_ID
firebase.app-id=YOUR_APP_ID

# ---- Email (OTP + password reset) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=YOUR_EMAIL@gmail.com
