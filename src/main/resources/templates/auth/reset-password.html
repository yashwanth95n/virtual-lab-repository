<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reset password · Ledger LMS</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-card-left">
      <h1>WELCOME</h1>
      <h2>Ledger LMS</h2>
      <p>Reset the password for your student or admin account.</p>
    </div>
    <div class="auth-card-right">
      <h2>Reset password</h2>
      <p class="sub">Enter your email and a new password</p>
      <div th:if="${error}" class="auth-error" th:text="${error}"></div>
      <div th:if="${success}" class="auth-success" th:text="${success}"></div>
      <form method="post" th:action="@{/reset-password}">
        <div class="auth-field">
          <label>Email</label>
          <div class="auth-input-wrap">
            <span class="ico">✉</span>
            <input class="auth-input" type="email" name="email" placeholder="you@ledger.edu" required/>
          </div>
        </div>
        <div class="auth-field">
          <label>New password (6–16 chars)</label>
          <div class="auth-input-wrap">
            <span class="ico">🔒</span>
            <input class="auth-input" type="password" name="password" placeholder="New password" required minlength="6" maxlength="16"/>
          </div>
        </div>
        <button type="submit" class="auth-btn">Update password</button>
      </form>
      <p class="auth-links"><a th:href="@{/login}">Back to sign in</a></p>
    </div>
  </div>
</body>
</html>
