<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Chat</title><link rel="stylesheet" th:href="@{/css/style.css}"/>
<style>
.chat-panel{max-width:720px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;height:calc(100vh - 160px)}
.chat-msgs{flex:1;overflow:auto;padding:24px;background:#f8fafc}
.bubble{max-width:75%;padding:12px 16px;border-radius:16px;margin-bottom:12px}
.bubble.me{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bubble.them{background:#fff;border:1px solid #e2e8f0;border-bottom-left-radius:4px}
.bubble .who{font-size:.75rem;opacity:.85;margin-bottom:4px}
.chat-input{padding:16px;border-top:1px solid #e2e8f0;display:flex;gap:10px}
.chat-input textarea{flex:1;padding:12px;border:1px solid #e2e8f0;border-radius:12px;resize:none;min-height:48px}
</style>
</head>
<body>
<div th:replace="~{fragments/layout :: student-sidebar(${activePage})}"></div>
<div class="main">
  <div th:replace="~{fragments/layout :: topbar('Support Chat', ${student})}"></div>
  <div class="content">
    <div class="chat-panel">
      <div class="chat-msgs" id="msgs">
        <div th:each="m : ${messages}" class="bubble" th:classappend="${m.fromRole == 'STUDENT'} ? 'me' : 'them'">
          <div class="who" th:text="${m.fromRole == 'STUDENT'} ? 'You' : ('Admin · ' + m.fromName)">You</div>
          <div th:text="${m.message}">Msg</div>
          <div style="font-size:.7rem;opacity:.7;margin-top:4px" th:text="${m.sentAt != null ? #temporals.format(m.sentAt,'MMM d HH:mm') : ''}">—</div>
        </div>
        <div th:if="${#lists.isEmpty(messages)}" style="text-align:center;color:#94a3b8;padding:40px">No messages yet. Ask admin anything.</div>
      </div>
      <form method="post" th:action="@{/student/chat/send}" class="chat-input">
        <textarea name="message" required placeholder="Type your question..."></textarea>
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>
  </div>
</div>
<script>var el=document.getElementById('msgs');if(el)el.scrollTop=el.scrollHeight;</script>
</body>
</html>
