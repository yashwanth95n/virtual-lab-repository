<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Enrollments</title><link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body>
<div th:replace="~{fragments/layout :: student-sidebar(${activePage})}"></div>
<div class="main">
  <div th:replace="~{fragments/layout :: topbar('My Enrollments', ${student})}"></div>
  <div class="content">
    <div class="course-grid" style="grid-template-columns:repeat(3,1fr)">
      <div th:each="e : ${enrollments}" class="course-card">
        <div th:with="c=${courseMap.get(e.courseId)}">
          <div class="card-art art-blue" th:if="${c == null or c.coverImage == null}"><span>📚</span></div>
          <div class="card-art" th:if="${c != null and c.coverImage != null}" style="padding:0;overflow:hidden">
            <img th:src="${c.coverImage}" style="width:100%;height:140px;object-fit:cover" alt=""/>
          </div>
        </div>
        <div class="card-body">
          <h3 th:text="${e.courseTitle}">Course</h3>
          <div class="card-meta" th:text="${e.status + ' · ' + e.progress + '%'}">Active</div>
          <div style="height:6px;background:#e2e8f0;border-radius:4px;margin:8px 0">
            <div th:style="'width:' + ${e.progress} + '%;height:100%;background:linear-gradient(90deg,#4f46e5,#7c3aed);border-radius:4px'"></div>
          </div>
          <div class="card-footer">
            <span class="badge badge-active" th:text="${e.progress + '%'}">0%</span>
            <a th:href="@{/student/course/{id}(id=${e.courseId})}" class="btn btn-outline btn-sm">Open</a>
          </div>
        </div>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(enrollments)}" class="text-muted">Not enrolled in any course yet.</p>
  </div>
</div>
</body>
</html>
