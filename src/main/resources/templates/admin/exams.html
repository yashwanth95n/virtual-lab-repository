<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Exams</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
<div class="main">
  <div th:replace="~{fragments/layout :: topbar('Exams', ${admin})}"></div>
  <div class="content">
    <div class="toolbar"><a th:href="@{/admin/exams/create}" class="btn btn-primary">+ Create Exam</a></div>
    <div class="course-grid" style="grid-template-columns:repeat(3,1fr)">
      <div th:each="e : ${exams}" class="course-card">
        <div class="card-art art-purple" th:if="${e.coverImage == null}"><span>📝</span></div>
        <div class="card-art" th:if="${e.coverImage != null}" style="padding:0;overflow:hidden">
          <img th:src="${e.coverImage}" style="width:100%;height:140px;object-fit:cover" alt=""/>
        </div>
        <div class="card-body">
          <h3>
            <span class="badge badge-published" th:text="'EX' + ${e.id}">EX1</span>
            <span th:text="${e.title}">Exam</span>
          </h3>
          <div class="card-meta"><span th:text="${e.branch}">CS</span> · <span th:text="${e.durationMinutes + ' min'}">60</span></div>
          <div class="card-footer">
            <span class="badge badge-published" th:text="${e.status}">Published</span>
            <a th:href="@{/admin/exams/{id}(id=${e.id})}" class="btn btn-outline btn-sm">Open</a>
            <form th:action="@{/admin/exams/{id}/delete(id=${e.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete exam?');">
              <button type="submit" class="btn btn-outline btn-sm" style="color:#ef4444">Delete</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(exams)}" class="text-muted">No exams yet.</p>
  </div>
</div>
</body>
</html>
