<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Add Assignment · Ledger LMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Add Assignment', ${admin})}"></div>
    <div class="content">
      <div class="form-card">
        <form method="post" th:action="@{/admin/assessments/assignment/create}" enctype="multipart/form-data">
          <div class="form-group"><label>Title *</label><input type="text" name="title" required/></div>
          <div class="form-group"><label>Course</label>
            <select name="courseId" required>
              <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title + ' (' + c.category + ')'}">Course</option>
            </select>
          </div>
          <div class="form-group"><label>Branch * (only these students get this assignment)</label>
            <select name="branch" required>
              <option th:each="b : ${branches}" th:value="${b.code}" th:text="${b.code}">CS</option>
            </select>
          </div>
          <div class="form-group"><label>Due Date</label><input type="date" name="dueDate" required/></div>
          <div class="form-group"><label>Description</label><textarea name="description"></textarea></div>
          <div class="form-group"><label>Upload PDF / file (optional)</label><input type="file" name="file" accept=".pdf,.doc,.docx,.txt"/></div>
          
          <button type="submit" class="btn btn-primary">Create Assignment</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
