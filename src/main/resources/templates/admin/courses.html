<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Courses · Ledger LMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Courses', ${admin})}"></div>
    <div class="content">
      <div class="toolbar" style="flex-wrap:wrap;gap:8px">
        <a th:href="@{/admin/courses}" class="btn" th:classappend="${branch == null} ? 'btn-primary' : 'btn-outline'">All</a>
        <a th:each="b : ${branches}" th:href="@{/admin/courses(branch=${b.code})}"
           class="btn" th:classappend="${b.code == branch} ? 'btn-primary' : 'btn-outline'" th:text="${b.code}">CS</a>
        <a th:href="@{/admin/courses/create}" class="btn btn-primary" style="margin-left:auto">+ Create Course</a>
      </div>
      <div class="course-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="course-card card-3d" th:each="c,stat : ${courses}">
          <div class="card-art" th:if="${c.coverImage == null}"
               th:classappend="${stat.index % 6 == 0} ? 'art-pink' : (${stat.index % 6 == 1} ? 'art-purple' : (${stat.index % 6 == 2} ? 'art-blue' : (${stat.index % 6 == 3} ? 'art-green' : (${stat.index % 6 == 4} ? 'art-yellow' : 'art-orange'))))">
            <span>📚</span>
          </div>
          <div class="card-art" th:if="${c.coverImage != null}" style="padding:0;overflow:hidden">
            <img th:src="${c.coverImage}" alt="" style="width:100%;height:140px;object-fit:cover"/>
          </div>
          <div class="card-body">
            <h4 th:text="${c.title}">Title</h4>
            <p th:text="${c.instructorName + ' · ' + c.enrolledCount + ' enrolled'}">Instructor</p>
            <div class="card-footer" style="flex-wrap:wrap;gap:6px">
              <span class="badge"
                    th:classappend="${c.status == 'Published'} ? 'badge-published' : (${c.status == 'Inactive'} ? 'badge-suspended' : 'badge-draft')"
                    th:text="${c.status}">Published</span>
              <a th:href="@{/admin/courses/{id}/edit(id=${c.id})}" class="btn btn-outline btn-sm">Edit</a>
              
              <form th:if="${c.status != 'Inactive'}" th:action="@{/admin/courses/{id}/deactivate(id=${c.id})}" method="post" style="display:inline">
                <button type="submit" class="btn btn-outline btn-sm">Deactivate</button>
              </form>
              <form th:if="${c.status == 'Inactive'}" th:action="@{/admin/courses/{id}/activate(id=${c.id})}" method="post" style="display:inline">
                <button type="submit" class="btn btn-outline btn-sm">Activate</button>
              </form>
              <form th:action="@{/admin/courses/{id}/delete(id=${c.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete this course permanently?');">
                <button type="submit" class="btn btn-outline btn-sm" style="color:#ef4444">Delete</button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div th:if="${#lists.isEmpty(courses)}" class="text-muted mt-3">No courses yet. Create one!</div>
    </div>
  </div>
</body>
</html>
