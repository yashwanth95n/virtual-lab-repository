<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Lab activities</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
<div class="main">
  <div th:replace="~{fragments/layout :: topbar('Lab activities', ${admin})}"></div>
  <div class="content">
    <div class="mb-3">
      <a class="btn btn-primary btn-sm" th:href="@{/admin/lab/activities/export.pdf}">Download PDF</a>
      <a class="btn btn-outline btn-sm" th:href="@{/admin/lab/activities/export.docx}">Download Word</a>
      <a class="btn btn-outline btn-sm" th:href="@{/admin/lab}">Back to Lab VM</a>
    </div>
    <div class="table-card">
      <table class="table table-bordered table-hover">
        <thead class="table-light">
          <tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Lab VM</th><th>Details</th></tr>
        </thead>
        <tbody>
          <tr th:each="a : ${activities}">
            <td th:text="${a.createdAt}">—</td>
            <td th:text="${a.userName}">—</td>
            <td th:text="${a.userRole}">—</td>
            <td th:text="${a.action}">—</td>
            <td th:text="${a.labVmId}">—</td>
            <td th:text="${a.details}">—</td>
          </tr>
          <tr th:if="${#lists.isEmpty(activities)}"><td colspan="6" class="text-muted">No activity yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
