<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Edit Course · Ledger LMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Edit Course', ${admin})}"></div>
    <div class="content">
      <div class="form-card">
        <form method="post" th:action="@{/admin/courses/{id}/edit(id=${course.id})}">
          <div class="form-group"><label>Title</label><input type="text" name="title" th:value="${course.title}" required/></div>
          <div class="form-group"><label>Branch / Category</label><input type="text" name="category" th:value="${course.category}"/></div>
          <div class="form-group"><label>Description</label><textarea name="description" th:text="${course.description}"></textarea></div>
          <div class="form-group"><label>Status</label>
            <select name="status">
              <option value="Draft" th:selected="${course.status == 'Draft'}">Draft</option>
              <option value="Published" th:selected="${course.status == 'Published'}">Published</option>
              <option value="Archived" th:selected="${course.status == 'Archived'}">Archived</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </form>

        <h3 class="mt-3 mb-2">Course sequence (order)</h3>
        <p class="hint">Use ↑ ↓ to reorder. Students see materials in this order.</p>
        <div th:each="m : ${materials}" class="question-block flex" style="justify-content:space-between;align-items:center;">
          <div>
            <strong th:text="${m.orderIndex + 1 + '. ' + m.title}">File</strong>
            <span class="badge badge-draft" th:text="${m.type}">PDF</span>
            <a th:if="${m.filePath}" th:href="${m.filePath}" target="_blank" class="btn btn-outline btn-sm" style="margin-left:8px;">Open</a>
          </div>
          <div class="flex gap-2">
            <form th:action="@{/admin/materials/{id}/move(id=${m.id})}" method="post" style="display:inline;">
              <input type="hidden" name="dir" value="up"/>
              <button type="submit" class="btn btn-outline btn-sm">↑</button>
            </form>
            <form th:action="@{/admin/materials/{id}/move(id=${m.id})}" method="post" style="display:inline;">
              <input type="hidden" name="dir" value="down"/>
              <button type="submit" class="btn btn-outline btn-sm">↓</button>
            </form>
            <form th:action="@{/admin/materials/{id}/delete(id=${m.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete this file?');">
              <button type="submit" class="btn btn-outline btn-sm" style="color:#ef4444">Delete</button>
            </form>
          </div>
          <div th:if="${m.type == 'NOTE'}" style="width:100%;margin-top:8px;">
            <form method="post" th:action="@{/admin/materials/{id}/update-note(id=${m.id})}">
              <textarea name="content" th:text="${m.content}" style="min-height:60px;"></textarea>
              <button type="submit" class="btn btn-sm btn-primary mt-2">Save note</button>
            </form>
          </div>
        </div>
        <div th:if="${#lists.isEmpty(materials)}" class="text-muted">No materials yet.</div>

        <h3 class="mt-3 mb-2">Upload more files</h3>
        <form method="post" th:action="@{/admin/courses/{id}/materials/upload(id=${course.id})}" enctype="multipart/form-data">
          <div class="form-group"><label>Videos</label><input type="file" name="videos" multiple accept="video/*"/></div>
          <div class="form-group"><label>PDFs</label><input type="file" name="pdfs" multiple accept=".pdf"/></div>
          <div class="form-group"><label>Notes</label><input type="file" name="notes" multiple/></div>
          <button type="submit" class="btn btn-primary">Add to course</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
