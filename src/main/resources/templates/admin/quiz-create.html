<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Create Quiz · Ledger LMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Create Quiz', ${admin})}"></div>
    <div class="content">
      <div class="form-card" style="max-width:800px">
        <form method="post" th:action="@{/admin/assessments/quiz/create}" enctype="multipart/form-data" id="quizForm">
          <div class="form-group">
            <label>Quiz title *</label>
            <input type="text" name="title" required/>
          </div>
          <div class="form-group">
            <label>Branch *</label>
            <select name="branch" required>
              <option value="">Select</option>
              <option th:each="b : ${branches}" th:value="${b.code}" th:text="${b.code}">CS</option>
              <option value="All">All</option>
            </select>
          </div>
          <div class="form-group">
            <label>Course (optional)</label>
            <input type="text" name="courseName" placeholder="Course name"/>
          </div>
          <div class="form-group">
            <label>How many questions? (0 = all from file)</label>
            <input type="number" name="questionLimit" value="10" min="0"/>
          </div>
          <div class="form-group">
            <label>Upload PDF / DOC / TXT</label>
            <input type="file" name="questionFile" accept=".pdf,.doc,.docx,.txt"/>
            <div class="hint">Formats: <code>1. Question?</code> or <code>Q1: … A: B: C: D: ANS: A</code></div>
          </div>
          <div class="form-group">
            <label>Or paste questions</label>
            <textarea name="pasteContent" rows="6" placeholder="1. What is TCP?&#10;2. Explain DNS."></textarea>
          </div>
          <div class="form-group">
            <label>Topic (for bank)</label>
            <input type="text" name="topic"/>
          </div>
          <div class="form-group">
            <label><input type="checkbox" name="saveToBank" value="true"/> Save to question bank</label>
          </div>

          <h3 style="margin:16px 0 10px;font-size:1rem">Or add questions manually</h3>
          <div id="manualQs"></div>
          <div class="toolbar" style="margin-bottom:16px">
            <button type="button" class="btn btn-outline btn-sm" onclick="addQ()">+ Add question</button>
            <select id="bulkCount" class="search-box" style="min-width:auto">
              <option value="5">+5</option>
              <option value="10">+10</option>
              <option value="15">+15</option>
              <option value="20">+20</option>
            </select>
            <button type="button" class="btn btn-outline btn-sm" onclick="addBulk()">Add bulk</button>
          </div>

          <button type="submit" class="btn btn-primary">Save &amp; Publish Quiz</button>
          <a th:href="@{/admin/assessments?tab=quizzes}" class="btn btn-outline">Cancel</a>
        </form>
      </div>
    </div>
  </div>
  <script>
    let qi = 0;
    function addQ() {
    	  const i = qi++;
    	  const d = document.createElement('div');
    	  d.className = 'question-block';
    	  d.id = 'qb-' + i;
    	  d.innerHTML = `
    	    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    	      <strong>Question</strong>
    	      <button type="button" class="btn btn-outline btn-sm" style="color:#ef4444"
    	              onclick="document.getElementById('qb-${i}').remove()">Remove</button>
    	    </div>
    	    <div class="form-group"><label>Question text</label>
    	      <input name="qText" required placeholder="Question text"/></div>
    	    <div class="form-group"><input name="qA" placeholder="Option A" required/></div>
    	    <div class="form-group"><input name="qB" placeholder="Option B" required/></div>
    	    <div class="form-group"><input name="qC" placeholder="Option C"/></div>
    	    <div class="form-group"><input name="qD" placeholder="Option D"/></div>
    	    <div class="form-group"><label>Correct</label>
    	      <select name="qAns"><option>A</option><option>B</option><option>C</option><option>D</option></select>
    	    </div>`;
    	  document.getElementById('manualQs').appendChild(d);
    	}
  </script>
</body>
</html>
