<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Profile · Ledger LMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div th:replace="~{fragments/layout :: admin-sidebar(${activePage})}"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Profile', ${admin})}"></div>
    <div class="content">
      <p th:if="${param.saved}" style="color:#047857">Profile saved.</p>
      <p th:if="${param.error}" style="color:#b91c1c" th:text="${param.error[0]}">Error</p>

      <div class="form-card" style="max-width:640px;margin-bottom:20px">
        <h3>My profile</h3>
        <form method="post" th:action="@{/admin/settings/profile}">
          <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" th:value="${admin.name}" required/>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" th:value="${admin.email}" required/>
          </div>
          <div class="form-group">
            <label>Mobile number</label>
            <input type="text" name="mobile" th:value="${admin.mobile}" maxlength="10" placeholder="10 digit mobile"/>
          </div>
          <button type="submit" class="btn btn-primary mt-2">Save profile</button>
        </form>
      </div>

      <div class="form-card" style="max-width:640px">
        <h3>Platform controls</h3>
        <form method="post" th:action="@{/admin/settings}">
          <div class="toggle-row">
            <div>
              <strong>Student portal enabled</strong>
              <div class="hint">When off, student login and pages are blocked.</div>
            </div>
            <label class="switch">
              <input type="checkbox" name="studentPortalEnabled" th:checked="${settings.studentPortalEnabled}"/>
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-row">
            <div>
              <strong>Allow self-registration</strong>
              <div class="hint">Let students create their own accounts.</div>
            </div>
            <label class="switch">
              <input type="checkbox" name="allowSelfRegistration" th:checked="${settings.allowSelfRegistration}"/>
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-row">
            <div>
              <strong>Require enrollment approval</strong>
              <div class="hint">Manual enrollments need admin sign-off.</div>
            </div>
            <label class="switch">
              <input type="checkbox" name="requireEnrollmentApproval" th:checked="${settings.requireEnrollmentApproval}"/>
              <span class="slider"></span>
            </label>
          </div>
          <button type="submit" class="btn btn-primary mt-3">Save controls</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
