<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    background:#1e293b;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    color:#60a5fa;
}

.back-btn{
    color:white;
    text-decoration:none;
    background:#2563eb;
    padding:10px 18px;
    border-radius:8px;
}

.container{
    display:flex;
    height:calc(100vh - 80px);
}

.sidebar{
    width:280px;
    background:#1e293b;
    padding:20px;
    overflow-y:auto;
}

.sidebar h3{
    margin-bottom:20px;
}

.note-btn{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
    cursor:pointer;
    text-align:left;
    font-size:15px;
}

.note-btn:hover{
    background:#2563eb;
}

.viewer{
    flex:1;
    background:white;
    color:#111827;
    padding:30px;
    overflow-y:auto;
}

.viewer h2{
    margin-bottom:20px;
}

pre{
    white-space:pre-wrap;
    word-wrap:break-word;
    line-height:1.7;
    font-size:15px;
    font-family:Arial, Helvetica, sans-serif;
}
</style>
</head>

<body>

<header>

<h2 id="courseTitle">Notes</h2>

<a href="course.html?course=linux" id="backBtn" class="back-btn">
← Back
</a>

</header>

<div class="container">

<div class="sidebar">

<h3>Notes</h3>

<button class="note-btn"
onclick="loadNote('linux-basic-notes.txt','Linux Basic Notes')">
Linux Basic Notes
</button>

<button class="note-btn"
onclick="loadNote('linux-commands-notes.txt','Linux Commands Notes')">
Linux Commands Notes
</button>

<button class="note-btn"
onclick="loadNote('linux-security-notes.txt','Linux Security Notes')">
Linux Security Notes
</button>

</div>

<div class="viewer">

<h2 id="noteTitle">Select a Note</h2>

<pre id="noteContent">
Choose a note from the left.
</pre>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const course = params.get("course") || "linux";

const names={
    linux:"Linux Security Notes",
    network:"Network Security Notes",
    web:"Web Security Notes",
    crypto:"Cryptography Notes"
};

document.getElementById("courseTitle").innerText=names[course];

document.getElementById("backBtn").href=
"course.html?course="+course;

async function loadNote(file,title){

    document.getElementById("noteTitle").innerText=title;

    try{

        const response=await fetch(
            "http://localhost:5000/notes/"+file
        );

        const text=await response.text();

        document.getElementById("noteContent").textContent=text;

    }
    catch(error){

        document.getElementById("noteContent").textContent=
        "Unable to load note.";

    }

}

</script>

</body>
</html>
