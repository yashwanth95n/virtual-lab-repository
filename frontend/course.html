<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    background:#1e293b;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    color:#60a5fa;
}

.back-btn{
    color:white;
    text-decoration:none;
    background:#2563eb;
    padding:10px 18px;
    border-radius:8px;
}

.container{
    display:flex;
    height:calc(100vh - 80px);
}

.sidebar{
    width:250px;
    background:#1e293b;
    padding:20px;
}

.sidebar h3{
    margin-bottom:20px;
}

.sidebar button{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#334155;
    color:white;
    font-size:15px;
}

.sidebar button:hover{
    background:#2563eb;
}

.content{
    flex:1;
    padding:40px;
    background:#f8fafc;
    color:#111827;
}

.content h2{
    margin-bottom:20px;
}

.content ul{
    margin-left:20px;
    line-height:2;
}

.start-btn{
    margin-top:20px;
    padding:12px 20px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.start-btn:hover{
    background:#15803d;
}
</style>
</head>

<body>

<header>
    <h2 id="courseTitle">Course</h2>

    <a href="home.html" class="back-btn">← Back</a>
</header>

<div class="container">

    <div class="sidebar">

        <h3>Contents</h3>

        <button onclick="showSection('videos')">🎥 Videos</button>

        <button onclick="showSection('pdfs')">📄 PDFs</button>

        <button onclick="showSection('notes')">📝 Notes</button>    

        <button onclick="showSection('labs')">🐳 Virtual Labs</button>

    </div>

    <div class="content" id="content">

        <h2>Welcome</h2>

        <p>Select a section from the left menu.</p>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const course = params.get("course");

const names = {
    linux:"Linux Security",
    network:"Network Security",
    web:"Web Security",
    crypto:"Cryptography"
};

document.getElementById("courseTitle").innerText =
names[course] || "Course";

function showSection(section){

    let html="";

    if(section==="videos"){
    window.location.href = "videos.html?course=" + course;
    return;
}

    if(section==="pdfs"){
    window.location.href="pdfs.html?course="+course;
    return;
}

    if(section==="notes"){
    window.location.href="notes.html?course="+course;
    return;
}

    if(section==="labs"){
    html=`
    <h2>Virtual Labs</h2>

    <p>Click the button below to open the Virtual Lab environment.</p>

    <button class="start-btn"
        onclick="window.location.href='labs.html?course=${course}'">
        Start Lab
    </button>`;
}

    document.getElementById("content").innerHTML=html;

}

</script>

</body>
</html>
