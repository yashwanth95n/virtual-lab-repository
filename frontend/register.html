<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Cyber Lab</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    color:#0f172a;
}

.subtitle{
    text-align:center;
    color:#666;
    margin:10px 0 25px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.link{
    text-align:center;
    margin-top:18px;
}

.link a{
    text-decoration:none;
    color:#2563eb;
    font-weight:bold;
}

/* Popup */

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup-box{
    background:#fff;
    width:320px;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

.popup-box h3{
    color:#16a34a;
    margin-bottom:10px;
}

.popup-box p{
    margin-bottom:20px;
}

.popup-box button{
    width:120px;
}
</style>
</head>

<body>

<div class="container">

<h2>Cyber Lab</h2>
<p class="subtitle">Create your account</p>

<form id="registerForm">

<div class="input-group">
<label>Full Name</label>
<input type="text" id="full_name" required>
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<button type="submit">Create Account</button>

</form>

<div class="link">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<div class="popup" id="popup">
    <div class="popup-box">
        <h3>Cyber Lab</h3>
        <p id="popupMessage"></p>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<script src="js/auth.js"></script>

</body>
</html>
